services:
  wsgi:
    container_name: argon_api
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: gunicorn app.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-3} --timeout ${GUNICORN_TIMEOUT:-600}
    env_file:
      - ../.env
    environment:
      APP_ENV: prod
      DEBUG: "false"
      DJANGO_RUN_MIGRATIONS: "1"
      DJANGO_COLLECTSTATIC: "1"
      DB_HOST: postgres
      DB_PORT: 5432
      ADK_DB_URL: postgresql+asyncpg://${DB_USER:-argon_db_owner}:${DB_PASSWORD:-argon_db_password}@postgres:5432/adk_session_db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - argon_media_data:/app/media
    ports:
      - "${WSGI_PORT:-8007}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  asgi:
    container_name: argon_app
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: uvicorn app.asgi:application --host 0.0.0.0 --port 8001 --workers ${UVICORN_WORKERS:-2}
    env_file:
      - ../.env
    environment:
      APP_ENV: prod
      DEBUG: "false"
      DB_HOST: postgres
      DB_PORT: 5432
      ADK_DB_URL: postgresql+asyncpg://${DB_USER:-argon_db_owner}:${DB_PASSWORD:-argon_db_password}@postgres:5432/adk_session_db
      DJANGO_CREATE_SUPERUSER: "0"
      DJANGO_WAIT_FOR_MIGRATIONS: "1"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - argon_media_data:/app/media
    ports:
      - "${ASGI_PORT:-8008}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    container_name: argon_celery
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A app worker -l info
    env_file:
      - ../.env
    environment:
      APP_ENV: prod
      DEBUG: "false"
      DB_HOST: postgres
      DB_PORT: 5432
      ADK_DB_URL: postgresql+asyncpg://${DB_USER:-argon_db_owner}:${DB_PASSWORD:-argon_db_password}@postgres:5432/adk_session_db
      DJANGO_CREATE_SUPERUSER: "0"
      DJANGO_WAIT_FOR_MIGRATIONS: "1"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - argon_media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    container_name: argon_celery_beat
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A app beat -l info
    env_file:
      - ../.env
    environment:
      APP_ENV: prod
      DEBUG: "false"
      DB_HOST: postgres
      DB_PORT: 5432
      ADK_DB_URL: postgresql+asyncpg://${DB_USER:-argon_db_owner}:${DB_PASSWORD:-argon_db_password}@postgres:5432/adk_session_db
      DJANGO_CREATE_SUPERUSER: "0"
      DJANGO_WAIT_FOR_MIGRATIONS: "1"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    container_name: argon_psql
    image: pgvector/pgvector:pg16
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${DB_NAME:-argon_db}
      POSTGRES_USER: ${DB_USER:-argon_db_owner}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-argon_db_password}
      POSTGRES_ADDITIONAL_DATABASES: adk_session_db
    volumes:
      - argon_db_data:/var/lib/postgresql/data
      - ./postgres/init-additional-databases.sh:/docker-entrypoint-initdb.d/10-create-additional-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-argon_db_owner} -d ${DB_NAME:-argon_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    container_name: argon_redis
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - argon_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  argon_db_data:
  argon_redis_data:
  argon_media_data:
