<!DOCTYPE html>
<html lang="en">
  <body style="margin:0;padding:0;background:#f4efe6;font-family:Arial,sans-serif;color:#1f2937;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4efe6;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#fffdf8;border:1px solid #e6dfd2;">
            <tr>
              <td style="padding:40px 32px;">
                <p style="margin:0 0 16px;font-size:16px;">Hello {{ recipient_name }},</p>
                <p style="margin:0 0 16px;font-size:16px;line-height:1.6;">
                  We received a request to reset your Argon Chatbot password.
                </p>
                <p style="margin:0 0 24px;font-size:16px;line-height:1.6;">
                  Use the button below to choose a new password.
                </p>
                <p style="margin:0 0 24px;">
                  <a href="{{ reset_link }}" style="display:inline-block;background:#1f6f78;color:#ffffff;text-decoration:none;padding:14px 22px;border-radius:6px;font-weight:600;">
                    Reset Password
                  </a>
                </p>
                <p style="margin:0 0 12px;font-size:14px;line-height:1.6;color:#4b5563;">
                  If the button does not work, open this link:
                </p>
                <p style="margin:0 0 24px;font-size:14px;line-height:1.6;word-break:break-all;">
                  <a href="{{ reset_link }}" style="color:#1f6f78;">{{ reset_link }}</a>
                </p>
                <p style="margin:0;font-size:14px;line-height:1.6;color:#6b7280;">
                  If you did not request this, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
